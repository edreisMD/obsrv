deployment = "coding-worker-0"
engine = "sglang"
serving_url = "http://127.0.0.1:30000/metrics"
dcgm_url = "http://127.0.0.1:9400/metrics"
allocation = "exclusive"

# Run SGLang with --enable-metrics. Inspect /metrics and select a single scheduler.
# Labels differ across releases. Do not assume model_name or tp_rank is present.
[serving_labels]

[[gpus]]
id = "worker-0-gpu-0"
labels = { UUID = "GPU-REPLACE-ME" }

[metadata]
candidate_revision = "REPLACE-WITH-GIT-COMMIT"
workload_sha256 = "REPLACE-WITH-IMMUTABLE-REPLAY-HASH"
